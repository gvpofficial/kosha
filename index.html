<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kosha — Professional Invoice & Billing Management Suite." />
    <title>Kosha — Invoice Management</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/kosha favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1065FF" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&family=Encode+Sans+Expanded:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Special+Gothic+Expanded+One&family=Yatra+One&family=Rozha+One&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <!-- Application CSS Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/login.css" />
    <link rel="stylesheet" href="assets/css/invoice.css" />
    <link rel="stylesheet" href="assets/css/customers.css" />
    <link rel="stylesheet" href="assets/css/reports.css" />
    <link rel="stylesheet" href="assets/css/settings.css" />
</head>
<body>

    <!-- Global App Particle Canvas -->
    <canvas id="app-particle-canvas"></canvas>

    <!-- SPA Auth Container (Login View) -->
    <div id="spa-auth-container" style="display:none;"></div>

    <!-- Main App Container (App Pages View) -->
    <div class="main-content" id="main-content" style="display:none;"></div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.428.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <!-- SPA Application Engine -->
    <script type="module">
        import { getCurrentUser } from './assets/js/supabase.js';
        import { initSPARouter, navigateTo } from './assets/js/spaRouter.js';
        
        initSPARouter();

        async function initAppShell() {
            try {
                const user = await getCurrentUser();
                const hash = window.location.hash || '';
                let initialRoute = hash ? hash.replace('#/', '').replace('#', '') : 'dashboard';
                if (!initialRoute) initialRoute = 'dashboard';

                if (user) {
                    navigateTo(initialRoute, { replaceState: true });
                } else {
                    navigateTo('login', { replaceState: true });
                }
            } catch (e) {
                navigateTo('login', { replaceState: true });
            }
        }
        
        initAppShell();
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
    }
    </script>
</body>
</html>
